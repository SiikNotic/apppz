name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/pizza-dark-kitchen-app-hcg1g1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build static export
        env:
          # El anon/publishable key de Supabase está protegido por Row Level
          # Security y está pensado para ser público (termina en el bundle
          # del navegador de cualquier forma), así que no hace falta
          # guardarlo como secret.
          NEXT_PUBLIC_SUPABASE_URL: https://zfegecwnyhtihqugyljs.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_CRXjUaIKjKN-KHgHw08mmQ__sXaHD5u
          # Token PÚBLICO de Mapbox (pk.*) — configurar como Repository
          # variable O secret (Settings → Secrets and variables →
          # Actions), no hardcodeado acá: GitHub Push Protection lo
          # bloquea como posible secreto. El fallback con secrets.* cubre
          # el caso de que se haya guardado como secret en vez de
          # variable. Ver src/lib/mapbox.ts.
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN || secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
